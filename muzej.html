<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Preberite intervju z dr. Mejro Festić o poslanstvu Galerije Smaila Festića.">
    <title>Smail Festić - Intervju</title>
    <style>
        /* Preprečimo drsenje cele spletne strani */
        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            color: #333;
            background-color: #fbfbfb;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Zgornji pas z zameglitvijo */
        .header-band {
            width: 100%;
            background-color: rgba(251, 251, 251, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        /* Meni */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 900px;
            width: 90%;
            margin: 0 auto;
            padding: 15px 0;
            box-sizing: border-box;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: none;
            color: #111;
        }

        .navbar-links a {
            text-decoration: none;
            color: #555;
            margin-left: 20px;
            font-size: 0.95em;
        }

        .navbar-links a:hover {
            color: #000;
        }

        /* Osrednji del strani */
        .container {
            max-width: 900px;
            width: 90%;
            margin: 15px auto;
            padding: 0 10px;
            text-align: center;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 15px;
            font-weight: normal;
            color: #111;
            flex-shrink: 0;
        }

        /* Okvir za prikaz PDF-ja z lastnim drsnikom */
        .pdf-wrapper {
            width: 100%;
            flex-grow: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 10px;
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Spodnji pas z zameglitvijo */
        .footer-band {
            width: 100%;
            background-color: rgba(251, 251, 251, 0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        /* Noga */
        .footer {
            max-width: 900px;
            width: 90%;
            margin: 0 auto;
            padding: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .footer span {
            color: #111;
            font-size: 0.9em;
            font-weight: bold;
        }

        .footer a {
            color: #1877F2;
            text-decoration: underline;
            font-weight: bold;
            font-size: 0.9em;
        }

        .footer a:hover {
            color: #145dbf;
        }
    </style>
</head>
<body>

    <!-- Zgornji pas -->
    <header class="header-band">
        <nav class="navbar">
            <a class="navbar-brand" href="index.html">Smail Festić</a>
           <div class="navbar-links">
    <a href="index.html">O meni</a>
    <a href="video.html">Video</a>
    <a href="umetnine.html">Predstavitev</a>
    <a href="intervju.html">Intervju</a>
    <a href="muzej.html">Muzej Smail Festić</a>
        </div>
        </nav>
    </header>

    <!-- Vsebina -->
    <div class="container">
        <h1>Intervju in prispevki</h1>
        <div class="pdf-wrapper">
            <iframe src="Galerija%20Festić%20intervju%202017%20Mejra%20Festić.pdf#view=FitH"></iframe>
        </div>
    </div>

    <!-- Spodnji pas -->
    <footer class="footer-band">
        <div class="footer">
            <span>Kontakt:</span>
            <a href="https://www.facebook.com/mkcsmailfestic" target="_blank">Facebook</a>
        </div>
    </footer>

</body>
</html>
