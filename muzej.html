<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Muzej Smail Festić - pregled dolgih umetniških katalogov.">
    <title>Smail Festić - Muzej Smail Festić</title>
    <style>
        /* Poenotena nastavitev brez drsnika cele strani */
        html, body {
            overflow: hidden !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            line-height: 1.8;
            color: #333;
            background-color: #fbfbfb;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Zgornji pas */
        .header-band {
            width: 100%;
            background-color: rgba(251, 251, 251, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        /* Meni */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            padding: 15px 0;
            box-sizing: border-box;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: none;
            color: #111;
        }

        .navbar-links a {
            text-decoration: none;
            color: #555;
            margin-left: 20px;
            font-size: 0.95em;
        }

        .navbar-links a:hover {
            color: #000;
        }

        /* Osrednji del */
        .container {
            max-width: 800px;
            width: 90%;
            margin: auto auto;
            padding: 10px 20px;
            text-align: center;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: normal;
            color: #111;
            flex-shrink: 0;
        }

        /* Gumbi za izbiro posameznega kataloga */
        .catalog-tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        .catalog-btn {
            background-color: #fff;
            border: 1px solid rgba(0, 0, 0, 0.15);
            padding: 6px 14px;
            font-family: 'Georgia', serif;
            font-size: 0.9em;
            color: #444;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .catalog-btn:hover, .catalog-btn.active {
            background-color: #111;
            color: #fff;
            border-color: #111;
        }

        /* Okvir za prikaz PDF-ja z lastnim drsnikom */
        .pdf-wrapper {
            width: 100%;
            flex-grow: 1;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 10px;
        }

        .pdf-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Spodnji pas */
        .footer-band {
            width: 100%;
            background-color: rgba(251, 251, 251, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .footer {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .footer span {
            color: #111;
            font-size: 0.95em;
            font-weight: bold;
        }

        .footer a {
            color: #1877F2;
            text-decoration: underline;
            font-weight: bold;
            font-size: 0.95em;
        }

        .footer a:hover {
            color: #145dbf;
        }
    </style>
</head>
<body>

    <header class="header-band">
        <nav class="navbar">
            <a class="navbar-brand" href="index.html">Smail Festić</a>
            <div class="navbar-links">
                <a href="index.html">O meni</a>
                <a href="video.html">Video</a>
                <a href="umetnine.html">Predstavitev</a>
                <a href="intervju.html">Intervju</a>
                <a href="muzej.html" style="color: #000; font-weight: bold;">Muzej Smail Festić</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Muzej Smail Festić</h1>
        
        <!-- Izbirni gumbi za kataloge (imenujite datoteke spodaj glede na vaše dejanske PDF-je) -->
        <div class="catalog-tabs">
            <button class="catalog-btn active" onclick="loadCatalog('Katalog 1.pdf', this)">Katalog 1</button>
            <button class="catalog-btn" onclick="loadCatalog('Katalog2 ŽIDOVSKA.pdf', this)">Katalog 2</button>
            <button class="catalog-btn" onclick="loadCatalog('Katalog 3 lazja tehnika .pdf', this)">Katalog 3</button>
        </div>

        <!-- Okvir za PDF -->
        <div class="pdf-wrapper">
            <!-- Privzeto se naloži prvi katalog -->
            <iframe id="pdfFrame" src="katalog1.pdf#view=FitH"></iframe>
        </div>
    </div>

    <footer class="footer-band">
        <div class="footer">
            <span>Kontakt:</span>
            <a href="https://www.facebook.com/mkcsmailfestic" target="_blank">Facebook</a>
        </div>
    </footer>

    <script>
        // Skripta za preklapljanje med katalogom 1, 2 in 3 brez osveževanja cele strani
        function loadCatalog(pdfFileName, btnElement) {
            // Zamenjaj vir iframe-a
            document.getElementById('pdfFrame').src = pdfFileName + '#view=FitH';
            
            // Odstrani aktivni razred z vseh gumbov in ga dodaj kliknjenemu
            var buttons = document.querySelectorAll('.catalog-btn');
                buttons.forEach(function(b) { b.classList.remove('active'); });
            btnElement.classList.add('active');
        }
    </script>

</body>
</html>
