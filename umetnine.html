<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Predstavitev umetniških del in galerija slik Smaila Festića.">
    <title>Smail Festić - Predstavitev</title>
    <style>
        /* Poenotena nastavitev brez drsnika cele strani */
        html, body {
            overflow: hidden !important;
            height: 100% !important;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Georgia', serif;
            line-height: 1.6;
            color: #333;
            background-color: #fbfbfb;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Zgornji pas */
        .header-band {
            width: 100%;
            background-color: rgba(251, 251, 251, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        /* Poenoten meni (max-width: 800px) */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            padding: 15px 0;
            box-sizing: border-box;
        }

        .navbar-brand {
            font-weight: bold;
            font-size: 1.2em;
            text-decoration: none;
            color: #111;
        }

        .navbar-links a {
            text-decoration: none;
            color: #555;
            margin-left: 20px;
            font-size: 0.95em;
        }

        .navbar-links a:hover {
            color: #000;
        }

        /* Osrednji del */
        .container {
            max-width: 800px;
            width: 90%;
            margin: auto auto;
            padding: 10px 20px;
            text-align: center;
            box-sizing: border-box;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: normal;
            color: #111;
            flex-shrink: 0;
        }

        p {
            font-size: 1.05em;
            color: #444;
            max-width: 650px;
            margin: 0 0 15px 0;
            flex-shrink: 0;
        }

        /* Galerija slik z možnostjo drsenja znotraj okvirja */
        .gallery-grid {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            width: 100%;
            padding: 10px 0;
            scroll-snap-type: x mandatory;
            box-sizing: border-box;
        }

        .gallery-grid::-webkit-scrollbar {
            height: 6px;
        }

        .gallery-grid::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 3px;
        }

        .gallery-item {
            flex: 0 0 auto;
            width: 100%;
            max-height: 360px;
            display: flex;
            justify-content: center;
            align-items: center;
            scroll-snap-align: center;
        }

        .gallery-item img {
            max-width: 100%;
            max-height: 350px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            object-fit: contain;
        }

        /* Spodnji pas */
        .footer-band {
            width: 100%;
            background-color: rgba(251, 251, 251, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            position: relative;
            z-index: 10;
            flex-shrink: 0;
        }

        .footer {
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
            padding: 15px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .footer span {
            color: #111;
            font-size: 0.95em;
            font-weight: bold;
        }

        .footer a {
            color: #1877F2;
            text-decoration: underline;
            font-weight: bold;
            font-size: 0.95em;
        }

        .footer a:hover {
            color: #145dbf;
        }
    </style>
</head>
<body>

    <header class="header-band">
        <nav class="navbar">
            <a class="navbar-brand" href="index.html">Smail Festić</a>
            <div class="navbar-links">
                <a href="index.html">O meni</a>
                <a href="video.html">Video</a>
                <a href="umetnine.html" style="color: #000; font-weight: bold;">Predstavitev</a>
                <a href="intervju.html">Intervju</a>
                <a href="muzej.html">Muzej Smail Festić</a>
            </div>
        </nav>
    </header>

    <div class="container">
        <h1>Predstavitvena galerija</h1>
        <p>
            Oglejte si izbor umetniških del in fotografij Smaila Festića.
        </p>

        <!-- Galerija z vključenimi vsemi 1-REN fotografijami -->
        <div class="gallery-grid">
            <div class="gallery-item"><img src="slika1.jpg" alt="Delo 1"></div>
            <div class="gallery-item"><img src="slika2.jpg" alt="Delo 2"></div>
            <div class="gallery-item"><img src="slika3.jpg" alt="Delo 3"></div>
            <div class="gallery-item"><img src="slika4.jpg" alt="Delo 4"></div>
            <div class="gallery-item"><img src="slika5.jpg" alt="Delo 5"></div>
            <div class="gallery-item"><img src="1-REN11988.JPG" alt="1-REN 11988"></div>
            <div class="gallery-item"><img src="1-REN11997-gotova.jpg" alt="1-REN 11997 gotova"></div>
            <div class="gallery-item"><img src="1-REN12021.JPG" alt="1-REN 12021"></div>
            <div class="gallery-item"><img src="1-REN12022.JPG" alt="1-REN 12022"></div>
            <div class="gallery-item"><img src="1-REN12034.JPG" alt="1-REN 12034"></div>
            <div class="gallery-item"><img src="1-REN12055.JPG" alt="1-REN 12055"></div>
            <div class="gallery-item"><img src="1-REN12061.JPG" alt="1-REN 12061"></div>
            <div class="gallery-item"><img src="1-REN12071.JPG" alt="1-REN 12071"></div>
            <div class="gallery-item"><img src="1-REN12093.JPG" alt="1-REN 12093"></div>
            <div class="gallery-item"><img src="1-REN12297.JPG" alt="1-REN 12297"></div>
        </div>
    </div>

    <footer class="footer-band">
        <div class="footer">
            <span>Kontakt:</span>
            <a href="https://www.facebook.com/mkcsmailfestic" target="_blank">Facebook</a>
        </div>
    </footer>

</body>
</html>
